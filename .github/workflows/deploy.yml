name: Deploy to GitHub Pages
on:
  push:
    branches: [react-todo]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages